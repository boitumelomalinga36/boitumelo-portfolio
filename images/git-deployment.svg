<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Git deployment workflow illustration</title>
  <desc id="desc">A Git branch flowing through review and deployment stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f05033"/>
      <stop offset=".55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g opacity=".12" stroke="#94a3b8">
    <path d="M0 105h1200M0 210h1200M0 315h1200M0 420h1200M0 525h1200M150 0v675M300 0v675M450 0v675M600 0v675M750 0v675M900 0v675M1050 0v675"/>
  </g>
  <g transform="translate(125 148) rotate(45 110 110)" filter="url(#glow)">
    <rect x="35" y="35" width="150" height="150" rx="18" fill="#f05033"/>
    <path d="M75 75l70 70M105 105l38-38M105 105v73" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
    <circle cx="75" cy="75" r="12" fill="#fff"/><circle cx="143" cy="67" r="12" fill="#fff"/><circle cx="105" cy="178" r="12" fill="#fff"/>
  </g>
  <g fill="none" stroke="url(#flow)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M380 390h118c48 0 57-76 105-76h102c48 0 58 76 106 76h210"/>
    <path d="M498 390v104h312V390" stroke-width="7" opacity=".8"/>
  </g>
  <g fill="#07111f" stroke-width="7">
    <circle cx="380" cy="390" r="24" stroke="#f05033"/>
    <circle cx="602" cy="314" r="24" stroke="#22d3ee"/>
    <circle cx="706" cy="314" r="24" stroke="#22d3ee"/>
    <circle cx="810" cy="390" r="24" stroke="#8b5cf6"/>
    <circle cx="1021" cy="390" r="24" stroke="#10b981"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" fill="#eef6ff">
    <text x="370" y="170" font-size="56" font-weight="800">Git Deployment</text>
    <text x="373" y="222" font-size="28" fill="#a9b7cc">Branch • Review • Release • Deploy</text>
    <text x="348" y="445" font-size="20">BRANCH</text>
    <text x="567" y="270" font-size="20">REVIEW</text>
    <text x="677" y="270" font-size="20">MERGE</text>
    <text x="775" y="445" font-size="20">RELEASE</text>
    <text x="980" y="445" font-size="20">LIVE</text>
  </g>
</svg>
